# Edge Function settings, matching what is deployed in production.

# GHL calls this webhook without a Supabase session; it authenticates with the
# x-tp-ops-key header checked against private.integration_webhook_tokens.
[functions.ghl-onboarding]
verify_jwt = false

# Accepts a user session (checked in code) or the scheduler key in x-tp-ops-key.
[functions.ghl-metrics-sync]
verify_jwt = false

[functions.manage-team-user]
verify_jwt = true

[functions.parse-eod-report]
verify_jwt = true

[functions.eod-payroll-integrations]
verify_jwt = true

[functions.slack-ticket-sync]
verify_jwt = false

[functions.slack-bridge]
verify_jwt = false

[functions.slack-interactions]
verify_jwt = false

[functions.parse-onboarding-pdf]
verify_jwt = false
